# Set everything to ERROR by default
log4j.rootLogger=ERROR, console
log4j.threshold=ERROR

# Console appender configuration
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n
log4j.appender.console.threshold=ERROR

# Explicitly suppress noisy loggers
log4j.logger.org=ERROR
log4j.logger.org.apache=ERROR
log4j.logger.org.apache.spark=ERROR
log4j.logger.org.sparkproject=ERROR
log4j.logger.org.apache.hadoop=ERROR
log4j.logger.org.apache.hadoop.util=ERROR
log4j.logger.org.apache.hadoop.security=ERROR
log4j.logger.org.eclipse.jetty=ERROR
log4j.logger.akka=ERROR

# Allow our application to log at INFO level (so you can see progress)
log4j.logger.org.janelia.saalfeldlab.hotknife=INFO
